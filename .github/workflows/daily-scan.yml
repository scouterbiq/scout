name: Daily lead scan

# Runs automatically every day, entirely on GitHub's own servers — no
# machine of yours needs to be on, no terminal needed, ever, once this is
# uploaded and the one secret below is set.
#
# Setup needed after uploading this repo, both done in the browser:
#   1. Repo Settings -> Secrets and variables -> Actions -> New repository
#      secret -> name it GEMINI_API_KEY -> paste your free key from
#      https://aistudio.google.com/apikey
#   2. Repo Settings -> Actions -> General -> under "Workflow permissions"
#      choose "Read and write permissions" (needed so this workflow can
#      commit the updated leads file back to the repo).

on:
  schedule:
    - cron: "0 1 * * *"  # 01:00 UTC daily = 9:00 AM Malaysia time
  workflow_dispatch: {}   # also lets you trigger it manually from the
                          # Actions tab in the browser, no schedule wait

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Commit scan outputs even when screening fails
        if: always()
        run: |
          git config user.name "scout-bot"
          git config user.email "scout-bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "Refresh Scout employer screening"
          git push

