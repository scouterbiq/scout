<!DOCTYPE html>
<html lang="en" class="scout-locked">
<head><link rel="stylesheet" href="access.css"><script src="access.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F7F5;--paper:#fff;--ink:#15171A;--ink-soft:#62686F;--ink-faint:#777D84;--line:#E6E7E4;--line-soft:#E6E7E4;--indigo:#4A52E0;--indigo-bg:#EDEEFC;--teal:#2E7D5B;--teal-ink:#2E7D5B;--teal-bg:#E7F3ED;--amber:#B8841F;--amber-ink:#876118;--amber-bg:#FBF1DF;font-family:Inter,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.topbar,.app{max-width:760px;margin:auto}.topbar{padding:40px 24px 0;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px}.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}.brand-text{font-size:20px;font-weight:700;letter-spacing:-.03em}.brand-sub{font:11px 'JetBrains Mono',monospace;color:var(--ink-faint);margin-top:6px}.brand .tag{font-size:10px}.stats{width:100%;font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin:4px 0 20px}
.app{padding:0 24px 100px}.list-controls{margin-bottom:12px}.search{width:100%;font:13.5px Inter,sans-serif;padding:11px 13px;border-radius:9px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}.search::placeholder{color:var(--ink-faint)}button:focus-visible,a:focus-visible{outline:2px solid var(--indigo);outline-offset:4px}.search:focus{outline:2px solid var(--indigo-bg);border-color:var(--indigo)}
.chips{display:flex;margin-bottom:10px}.chip{font:500 11px Inter,sans-serif;padding:4px 9px;border:1px solid var(--line);border-radius:6px;background:white;color:var(--ink-soft)}.status-toggle{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:3px}.status-toggle button{font:500 13px Inter,sans-serif;background:none;border:0;border-bottom:2px solid transparent;padding:10px 0;color:var(--ink-faint);cursor:pointer}.status-toggle button.active{color:var(--ink);border-color:var(--indigo)}.tab-count{font:10px 'JetBrains Mono',monospace;border:1px solid var(--line);border-radius:20px;padding:2px 6px;margin-left:5px}.active .tab-count{background:var(--indigo-bg);border-color:var(--indigo-bg);color:var(--indigo)}
.rows{padding-top:4px}.row{border-bottom:1px solid var(--line);padding:16px 6px;border-radius:8px}.row:hover,.row.selected{background:var(--paper)}.row.contacted .row-heading{opacity:.55}.row-heading{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;color:inherit;cursor:pointer;font:inherit;padding:0}.dot{width:8px;height:8px;border-radius:50%;background:var(--indigo);margin-top:6px;flex-shrink:0}.row-body{flex:1;min-width:0}.row-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}.row-company{font-size:14.5px;font-weight:600;line-height:1.4}.row-days{font:10px 'JetBrains Mono',monospace;color:var(--ink-faint);white-space:nowrap}.row-brief{font-size:13px;line-height:1.5;color:var(--ink-soft);margin-top:3px}.row-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.tag{font-size:10.5px;font-weight:500;padding:3px 8px;border-radius:6px;background:var(--indigo-bg);color:var(--indigo);border:0;line-height:1.5}
.row-detail{padding:18px 0 3px 20px;animation:appear .15s ease}.d-header{display:none}.section{margin-bottom:16px}.section-label,.signal-label{display:block;font:10px 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin-bottom:5px}.signal-box{margin-bottom:16px}.signal-box>svg{display:none}.signal-box p,.brief-text{font-size:13px;line-height:1.65;color:var(--ink-soft)}.brief-text{max-width:65ch}.contact-card{display:flex;flex-direction:column;gap:10px}.contact-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;font-size:13px;line-height:1.5;overflow-wrap:anywhere}.contact-row svg{flex-shrink:0;color:var(--ink-faint)}.contact-row a,.source-link{font-size:12px;color:var(--indigo);text-decoration:none;overflow-wrap:anywhere}.contact-row a:hover,.source-link:hover{text-decoration:underline}.contact-row small,.contact-note{font-size:11.5px;line-height:1.5;color:var(--ink-soft)}.source-link{display:inline-flex;align-items:center;gap:6px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.btn{font:500 12px Inter,sans-serif;display:inline-flex;align-items:center;gap:6px;padding:8px 11px;border:1px solid var(--line);border-radius:7px;background:white;color:var(--ink);text-decoration:none;cursor:pointer}.btn:hover{border-color:var(--ink-faint)}.btn.primary{background:var(--indigo);border-color:var(--indigo);color:white}.btn.done,.btn.subtle{color:var(--ink-soft)}.empty{padding:40px 10px;text-align:center;font-size:13px;color:var(--ink-soft)}
@keyframes appear{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}@media(max-width:520px){.topbar{padding:24px 18px 0}.app{padding:0 18px 70px}.row-top{align-items:flex-start}.row-days{padding-top:3px}.row-detail{padding-left:20px}.brand-sub{font-size:10px}.contact-row small{width:100%;padding-left:24px}}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div>
      <div class="brand-text">Scout</div>
      <div class="brand-sub" id="today-date">today's briefing</div>
    </div>
    <span id="source-badge" class="tag" ></span>
  </div>
  <div class="stats" id="stats"></div>
</div>

<div class="app">
  <div class="list-pane">
    <div class="list-controls">
      <input class="search" id="search" placeholder="Search company or training" aria-label="Search leads" />

    </div>
    <div class="chips" id="filters"><button class="chip active" type="button" aria-pressed="true">All</button></div>
<div class="status-toggle" id="status-toggle"></div>
    <div class="rows" id="rows"></div>
  </div>
</div>

<script type="application/scout-locked">
// ---------- Live data config ----------
// Paste your published Google Sheet CSV url here once it's set up.
// File > Share > Publish to web > select the leads tab > CSV > copy link.
const CONFIG = {
  SHEET_CSV_URL: "../data/leads.csv"
};

const sampleLeads = [];

let leads = sampleLeads;
let dataSource = "demo";

function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i], next = text[i+1];
    if (inQuotes){
      if (c === '"' && next === '"'){ field += '"'; i++; }
      else if (c === '"'){ inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"'){ inQuotes = true; }
      else if (c === ','){ row.push(field); field = ""; }
      else if (c === '\n' || c === '\r'){
        if (field.length || row.length){ row.push(field); rows.push(row); row = []; field = ""; }
        if (c === '\r' && next === '\n') i++;
      } else { field += c; }
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  const headers = rows.shift().map(h => h.trim());
  return rows.filter(r => r.length > 1 || r[0]).map(r => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = (r[i] || "").trim());
    return obj;
  });
}

async function loadLiveLeads(){
  if (!CONFIG.SHEET_CSV_URL){ return false; }
  try{
    const res = await fetch(CONFIG.SHEET_CSV_URL);
    if (!res.ok) throw new Error("Sheet fetch failed");
    const text = await res.text();
    const rows = parseCSV(text);

    leads = rows.filter(r => r.priorityTier === "top").map((r, i) => ({
      id: r.id || String(i + 1),
      company: r.company || "Unnamed company",
      industry: r.industry || "Uncategorised",
      training: r.training || "",
      fitNote: r.fitNote || "",
      score: Math.max(0, Math.min(100, Number(r.score) || 0)),
      brief: r.brief || "",
      signal: r.signal || "",
      contactName: r.contactName || "",
      contactRole: r.contactRole || "",
      contactLinkedIn: r.contactLinkedIn || "",
      contactEvidenceStatus: r.contactEvidenceStatus || "",
      companyDescription: r.companyDescription || r.brief || "",
      phone: r.phone || "",
      email: r.email || "",
      sourceLabel: r.sourceLabel || "Source",
      sourceUrl: r.sourceUrl || "#",
      dealValue: r.dealValue || "",
      days: Number(r.days) || 0,
      fullBrief: r.fullBrief || r.brief || "",
      contacted: false
    }));
    dataSource = "live";
    return true;
  } catch(err){
    console.warn("Lead data unavailable:", err.message);
    leads = sampleLeads;
    dataSource = "demo";
    return false;
  }
}

let activeFilter = "All";
let statusFilter = "active";
let searchTerm = "";
let selectedId = null;

let industries = ["All"];
function refreshIndustries(){ industries = ["All"]; activeFilter = "All"; }

function band(score){ return score >= 80 ? "hot" : score >= 50 ? "warm" : "cool"; }
function bandLabel(score){ return score === 0 ? "Not scored" : score >= 80 ? "Hot lead" : score >= 50 ? "Worth a call" : "Slow burn"; }
function bandColor(score){ return { hot: "#B4483A", warm: "#C2872F", cool: "#3E6259" }[band(score)]; }

function ringSVG(score, large){
  const size = large ? 64 : 34, stroke = large ? 5 : 3.5, r = (size - stroke) / 2, c = 2 * Math.PI * r;
  const offset = c - (score/100) * c;
  const color = bandColor(score);
  return `<div class="ring${large ? ' large':''}">
    <svg width="${size}" height="${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="var(--line)" stroke-width="${stroke}" fill="none"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="${stroke}" fill="none"
        stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
    </svg>
    <div class="ring-num">${score}</div>
  </div>`;
}


function renderStats(){
 const active=leads.filter(l=>!l.contacted).length;
 document.getElementById("stats").textContent=dataSource==="live" ? active+" active SME leads · Company briefs and public business contacts" : "Lead data could not be loaded. Refresh to try again.";
}
function renderStatusToggle(){
 const opts=[["active","Active"],["contacted","Contacted"],["all","All"]];
 document.getElementById("status-toggle").innerHTML=opts.map(([key,label])=>{const count=leads.filter(l=>key==="all" || (key==="active"?!l.contacted:l.contacted)).length;return '<button type="button" class="'+(statusFilter===key?'active':'')+'" aria-pressed="'+(statusFilter===key)+'" data-status="'+key+'">'+label+' <span class="tab-count">'+count+'</span></button>';}).join("");
 document.querySelectorAll("[data-status]").forEach(b=>b.onclick=()=>{statusFilter=b.dataset.status;selectedId=null;renderStatusToggle();renderRows();});
}
function visibleLeads(){
  return leads.filter(l =>
    (activeFilter === "All" || l.industry === activeFilter) &&
    (l.company.toLowerCase().includes(searchTerm) || l.training.toLowerCase().includes(searchTerm) || l.companyDescription.toLowerCase().includes(searchTerm)) &&
    (statusFilter === "all" || (statusFilter === "active" ? !l.contacted : l.contacted))
  ).sort((a,b) => b.score - a.score);
}

function escapeHtml(value){ return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function personProfileUrl(value){ try{ const u=new URL(value); return u.protocol==='https:' && /(^|\.)linkedin\.com$/.test(u.hostname) && u.pathname.startsWith('/in/') ? u.href : ''; }catch{return '';} }

function renderRows(){
 const list=visibleLeads();
 if(!list.some(l=>l.id===selectedId)) selectedId=null;
 const el=document.getElementById("rows");
 el.innerHTML=list.length ? list.map(l=>`
 <article class="row${l.id===selectedId?' selected':''}${l.contacted?' contacted':''}">
 <button type="button" class="row-heading" data-id="${escapeHtml(l.id)}" aria-expanded="${l.id===selectedId}">
 <span class="dot" aria-hidden="true"></span><span class="row-body">
 <span class="row-top"><span class="row-company">${escapeHtml(l.company)}</span><span class="row-days">${l.id===selectedId?'−':'+'}</span></span>
 <span class="row-brief" style="display:block">${escapeHtml(l.companyDescription || l.brief)}</span>
 ${l.training?'<span class="row-tags"><span class="tag">'+escapeHtml(l.training)+'</span></span>':''}
 </span></button>
 ${l.id===selectedId?'<div class="row-detail" id="detail"></div>':''}
 </article>`).join("") : '<div class="empty">'+(dataSource==='live'?'No leads match right now.':'Could not load leads. Please refresh to try again.')+'</div>';
 document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{const id=leads.find(l=>String(l.id)===b.dataset.id)?.id;selectedId=selectedId===id?null:id;renderRows();});
 renderDetail();
}
const icons = {
  user: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>',
  phone: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>',
  mail: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
  spark: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M18 6l-2.5 2.5M8.5 15.5L6 18"/></svg>',
  link: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1.5 1.5"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1.5-1.5"/></svg>'
};

function renderDetail(){
  const l = leads.find(x => x.id === selectedId);
  const detailEl = document.getElementById("detail");
  if (!detailEl) return;
  if (!l){ detailEl.innerHTML = `<div class="empty"><div>No lead selected</div></div>`; return; }
  detailEl.innerHTML = `
    <div class="d-header">
      ${ringSVG(l.score, true)}
      <div>
        <div class="d-name">${escapeHtml(l.company)}</div>
        <p class="company-description">${escapeHtml(l.companyDescription || l.brief)}</p>
        <div class="d-tags">
          <span class="tag state ${band(l.score)}">${bandLabel(l.score)}</span>
          ${l.training ? `<span class="tag">${l.training}</span>` : ''}
          <span class="tag">${l.dealValue}</span>
          ${l.contacted ? '<span class="tag contacted">Contacted</span>' : ''}
        </div>
      </div>
    </div>

    ${l.fitNote ? `<div class="section" style="margin-bottom:18px;"><div style="font-size:13px; color:var(--teal-ink); background:var(--teal-bg); border:1px solid #B9D2C9; border-radius:10px; padding:9px 14px; display:inline-block;">${escapeHtml(l.fitNote)}</div></div>` : ''}

    <div class="signal-box">
      ${icons.spark}
      <p><span class="signal-label">Outreach context</span>${escapeHtml(l.signal)}</p>
    </div>

    <div class="section">
      <div class="section-label">Company brief</div>
      <div class="brief-text">${escapeHtml(l.fullBrief)}</div>
    </div>

    <div class="section">
      <div class="section-label">Contact</div>
      <div class="contact-card">
        <div class="contact-row">${icons.user}<span>${escapeHtml(l.contactName || 'Contact person not yet verified')}${l.contactName && l.contactRole ? ' · '+escapeHtml(l.contactRole) : ''}</span></div>
        ${personProfileUrl(l.contactLinkedIn) ? `<div class="contact-row">${icons.link}<a href="${escapeHtml(personProfileUrl(l.contactLinkedIn))}" target="_blank" rel="noopener noreferrer">Contact LinkedIn profile</a></div><p class="contact-note">${escapeHtml(l.contactEvidenceStatus || 'Public professional profile; confirm role before outreach.')}</p>` : '<p class="contact-note">Person LinkedIn profile not yet verified.</p>'}
        ${l.phone ? `<div class="contact-row">${icons.phone}<a href="tel:${escapeHtml(l.phone.replace(/[^+0-9]/g,''))}">${escapeHtml(l.phone)}</a><small>Published business phone</small></div>` : '<p class="contact-note">No verified public phone found; use the company email.</p>'}
        ${l.email ? `<div class="contact-row">${icons.mail}<a href="mailto:${escapeHtml(l.email)}">${escapeHtml(l.email)}</a></div>` : ''}
      </div>
    </div>

    <div class="section">
      <div class="section-label">Source</div>
      <a class="source-link" href="${escapeHtml(l.sourceUrl)}" target="_blank" rel="noopener">${icons.link}${escapeHtml(l.sourceLabel)}</a>
    </div>

    <div class="actions">
      ${l.phone ? `<a class="btn primary" href="tel:${l.phone.replace(/\s/g,'')}">${icons.phone} Call now</a>` : ''}
      ${l.email ? `<a class="btn" href="mailto:${l.email}">${icons.mail} Email</a>` : ''}
      ${(!l.phone && !l.email) ? `<a class="btn primary" href="${escapeHtml(l.sourceUrl)}" target="_blank" rel="noopener">${icons.link} Find contact</a>` : ''}
      <button class="btn ${l.contacted ? '' : 'done'}" id="toggle-contacted">${l.contacted ? 'Move back to active' : 'Mark contacted'}</button>
      <button class="btn subtle" id="dismiss">Dismiss</button>
    </div>
  `;
  document.getElementById("toggle-contacted").onclick = () => { l.contacted = !l.contacted; renderStats(); renderStatusToggle(); renderRows(); };
  document.getElementById("dismiss").onclick = () => {
    const idx = leads.findIndex(x => x.id === l.id);
    leads.splice(idx, 1);
    renderStats(); renderStatusToggle(); renderRows();
  };
}

document.getElementById("search").addEventListener("input", (e) => { searchTerm = e.target.value.toLowerCase(); renderRows(); });
document.getElementById("today-date").textContent = new Date().toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' });

async function init(){
  const badge = document.getElementById("source-badge");
  badge.textContent = "Connecting…";
  await loadLiveLeads();
  badge.textContent = dataSource === "live" ? "Live briefing" : "Unavailable";
  selectedId = null;
  refreshIndustries();
  renderStats();
  renderStatusToggle();
  renderRows();
  renderDetail();
}

init();
</script>
<noscript class="scout-noscript">Enable JavaScript to enter the Scout access code.</noscript></body>
</html>
